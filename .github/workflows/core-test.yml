name: core-test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      # gradle.properties 钉死了本机 org.gradle.java.home(§10 遗留);CI 用环境 JDK 覆盖。开源复现同题。
      - run: ./gradlew :lib_lottery_core:test -Dorg.gradle.java.home=$JAVA_HOME
