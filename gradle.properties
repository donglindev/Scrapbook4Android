# 构建链基线见决策 #3(组合 A):JDK 21 / Gradle 8.13 / AGP 8.13 / Kotlin 2.4.20
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

android.useAndroidX=true
# 不能删:2021 年依赖(SmartRefreshLayout/recycler-margin 之一)仍拉 support-compat 26.1.0,靠 jetifier 转 AndroidX;依赖刷新后可移除
android.enableJetifier=true
# AGP 8 默认非传递 R;老 Scrapbook 代码(app/lib_views)跨模块引用 R.drawable.ic_pic 等,恢复旧语义
android.nonTransitiveRClass=false
kotlin.code.style=official

kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true
kapt.use.worker.api=true
kapt.incremental.apt=true
kapt.include.compile.classpath=false
