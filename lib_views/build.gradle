plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

def rootAndroid = rootProject.ext.android
def support = rootProject.ext.dependencies

android {
    namespace 'com.mb.scrapbook.lib.view'
    compileSdk rootAndroid.compileSdkVersion

    defaultConfig {
        minSdk rootAndroid.minSdkVersion
        targetSdk rootAndroid.targetSdkVersion
        versionCode rootAndroid.versionCode
        versionName rootAndroid.versionName

        ndk {
            //决策 #3:arm64-v8a 唯一 ABI(端侧 LLM 门槛,D16)
            abiFilters "arm64-v8a"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation project(':lib_base')

    support.each { k, v -> compileOnly v }

    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}