plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

def appId = rootProject.ext.appId
def rootAndroid = rootProject.ext.android
def support = rootProject.ext.dependencies

// 老依赖(BRVAH 3.0.10)传递 kotlin-android-extensions-runtime 1.3.72,与 kotlin-parcelize-runtime 2.4.20 的 parcel 类重复
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-android-extensions-runtime'
}

android {
    namespace 'com.mb.scrapbook.app'
    compileSdk rootAndroid.compileSdkVersion

    defaultConfig {
        applicationId appId.app
        minSdk rootAndroid.minSdkVersion
        targetSdk rootAndroid.targetSdkVersion
        versionCode rootAndroid.versionCode
        versionName rootAndroid.versionName

        ndk {
            //决策 #3:arm64-v8a 唯一 ABI(端侧 LLM 门槛,D16)
            abiFilters "arm64-v8a"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        dataBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

kapt {
    javacOptions {
        option("-Xmaxerrs", "500")
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':lib_base')
    implementation project(':lib_stock')
    implementation project(':lib_views')
    implementation project(':lib_lottery') // D21=A:竞技场主 Activity 在 lib_lottery,launcher 指向它

    support.each { k, v -> implementation v }

    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}